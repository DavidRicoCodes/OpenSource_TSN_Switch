# tsn-switch DetNet flow table (referenced from the main configuration with
# "detnet_config = <file>" in [global]).
#
# Data plane: DetNet MPLS over UDP/IP (RFC 9025, d-CW from RFC 8964):
#   Ethernet [802.1Q] | IPv4 | UDP (6635) | S-label | d-CW (0000 + 28-bit seq) | IP payload
#
# Every [flow] is one DetNet flow as seen by this node:
#
#   action = encap    ingress PE: application IP traffic selected by "match"
#                     gets the S-label and a sequence number and is tunnelled
#   action = forward  relay: matched by S-label (+ UDP port); the outer
#                     Ethernet/IP/UDP header is rewritten, S-label and d-CW kept
#   action = decap    egress PE: matched by S-label; the tunnel is removed and
#                     the inner IP packet leaves with a new Ethernet header
#
# PREOF:
#   replication  (PRF)  more than one "output" on an encap or forward flow
#   elimination  (PEF)  eliminate = yes   on forward / decap flows
#   ordering     (POF)  order = yes       on forward / decap flows
#                       (elimination runs first when both are enabled)
#
# Mapping from the old Go prototype (detnetData.json / newFlows.json):
#   "encapsulate" + newFlows {vlan: label}  ->  action = encap, match = vid=<vlan>
#   "forward"                               ->  action = forward
#   "pop"                                   ->  action = decap
#   "replicate" (40_1, 40_2, ...)           ->  one flow with several outputs
#   "eliminate" + maxRep                    ->  eliminate = yes (sliding window,
#                                               no maxRep needed)
#   "L2.flow_id" / "L2.pcp" / "L2.vlan"     ->  output vid= / pcp= (omit vid for untagged)
#
# Differences from the Go wire format: the S-label is a proper MPLS label
# stack entry (20-bit label, S=1, TTL 255), and forward/decap flows only accept
# the UDP destination port given by udp_port (default 6635).
#
# DetNet frames are routed before bridging and leave through the normal
# egress queues, so they get the port's Qbv / ATS schedule. Set
# "bridging = no" in [global] for a pure router. Leave room in the MTU of the
# DetNet links: the tunnel adds 36 bytes at the IP layer (IPv4 + UDP +
# S-label + d-CW), so an inner packet of up to MTU - 36 bytes fits. Frames
# that would exceed the egress MTU are dropped and counted.
#
# Flows are read at startup (SIGHUP does not reload this file).


# --- Ingress PE -------------------------------------------------------------
[flow video]
action = encap
label = 1000                   # S-label, 16..1048575
# Which application frames start this flow. Same fields as [classify] rules:
# in_port, vid, untagged, pcp, ethertype, src_mac, dst_mac, ip_proto,
# src_ip, dst_ip, dscp, src_port, dst_port. The payload must be IPv4 or IPv6.
match = in_port=p0 vid=10
# Egress traffic class. Default: taken from the output's PCP via [pcp-map].
# tc = 7
# One output = plain encapsulation, several = replication onto disjoint paths.
#   port=      egress port (default: FDB lookup on dst_mac)
#   dst_mac= src_mac=   (required)
#   vid= pcp=  802.1Q tag of the outer frame (no vid = untagged)
#   src_ip= dst_ip=     (required) tunnel endpoints
#   src_port= (49152) dst_port= (6635) dscp= (0) ttl= (64)
#   label=     push a different S-label on this output
#   tc=        traffic class of this output
output = port=p1 dst_mac=0a:00:00:00:02:01 src_mac=0a:00:00:00:01:02 vid=20 pcp=7 src_ip=192.168.12.1 dst_ip=192.168.12.2
output = port=p2 dst_mac=0a:00:00:00:03:02 src_mac=0a:00:00:00:01:03 vid=30 pcp=7 src_ip=192.168.13.1 dst_ip=192.168.13.3


# --- Relay ------------------------------------------------------------------
[flow video-relay]
action = forward
label = 1001                   # incoming S-label
udp_port = 6635                # incoming UDP destination port ("any" = do not check)
# eliminate = yes              # a relay may also eliminate / order / replicate
output = port=p1 dst_mac=0a:00:00:00:03:01 src_mac=0a:00:00:00:02:02 vid=21 pcp=7 src_ip=192.168.23.2 dst_ip=192.168.23.3


# --- Egress PE with elimination and ordering --------------------------------
[flow video-out]
action = decap
label = 1002
eliminate = yes
history = 1024                 # PEF window: sequence numbers remembered (power of 2)
order = yes
order_max_delay = 5ms          # POF: longest a packet waits for a missing one
order_buffer = 256             # POF: packets that can wait at the same time
reset_timeout = 1s             # forget the sequence state after this much silence
# A decap output has only Ethernet fields: port, dst_mac, src_mac, vid, pcp, tc.
output = port=p0 dst_mac=02:00:00:00:00:01 src_mac=0a:00:00:00:03:03
