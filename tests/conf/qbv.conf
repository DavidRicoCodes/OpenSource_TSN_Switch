# Qbv on the egress port towards h1: 10 ms cycle,
#   0 - 3 ms  only TC7 open
#   3 - 10 ms only TC0 open
# TC3 is never open, so PCP 3 traffic must never reach h1.
[global]
clock = realtime
stats_interval = 0

[port p0]
ifname = tsn-sw0
cpu = 2

[port p1]
ifname = tsn-sw1
cpu = 3
base_time = 0
cycle_time = 10ms
sched-entry = S 80 3ms
sched-entry = S 01 7ms

[port p2]
ifname = tsn-sw2
cpu = 4
