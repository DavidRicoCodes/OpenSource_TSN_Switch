# Programmable classification. The port towards h1 runs the same 10 ms
# schedule as qbv.conf (TC7 in [0,3) ms, TC0 in [3,10) ms). Untagged frames
# default to PCP 0 / TC0, so they only reach the TC7 window through a rule.
[global]
clock = realtime
stats_interval = 0

[port p0]
ifname = tsn-sw0
cpu = 2

[port p1]
ifname = tsn-sw1
cpu = 3
cycle_time = 10ms
sched-entry = S 80 3ms
sched-entry = S 01 7ms

[port p2]
ifname = tsn-sw2
cpu = 4

[classify]
rule = ip_proto=udp dst_port=5000 tc=7                 # by UDP port
rule = in_port=p0 src_ip=10.10.0.0/24 dscp=46 tc=7     # by IP header (EF)
rule = vid=200 port=p2                                 # VLAN 200 -> port p2
