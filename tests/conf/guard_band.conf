# Guard band check. The port towards h1 is modelled as a 100 Mbit/s link and
# TC0 may only transmit during the first 150 us of every 1 ms cycle.
# A 1400 B frame needs ~114 us on the wire, so exactly one frame fits in each
# window: a second one would overrun the gate and must wait for the next cycle.
[global]
clock = realtime
stats_interval = 0

[port p0]
ifname = tsn-sw0
cpu = 2

[port p1]
ifname = tsn-sw1
cpu = 3
link_speed = 100
guard_band = yes
cycle_time = 1ms
sched-entry = S 01 150us
sched-entry = S 00 850us

[port p2]
ifname = tsn-sw2
cpu = 4
