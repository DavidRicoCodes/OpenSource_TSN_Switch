# Strict priority check: all gates open, but the port towards h1 is modelled
# as a 10 Mbit/s link that the offered load (PCP 7 + PCP 0) oversubscribes.
# TC7 must get all of its traffic through, TC0 only what is left.
[global]
clock = realtime
stats_interval = 0

[port p0]
ifname = tsn-sw0
cpu = 2

[port p1]
ifname = tsn-sw1
cpu = 3
link_speed = 10

[port p2]
ifname = tsn-sw2
cpu = 4
