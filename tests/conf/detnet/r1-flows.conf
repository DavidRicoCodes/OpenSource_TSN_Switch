# Ingress PE: VLAN 10 from h0 becomes DetNet flow 1000, replicated on two paths.
[flow app]
action = encap
label = 1000
match = in_port=a vid=10
output = port=b dst_mac=0a:00:00:00:02:01 src_mac=0a:00:00:00:01:02 vid=20 pcp=7 src_ip=192.168.12.1 dst_ip=192.168.12.2
output = port=c dst_mac=0a:00:00:00:03:02 src_mac=0a:00:00:00:01:03 vid=30 pcp=7 src_ip=192.168.13.1 dst_ip=192.168.13.3
