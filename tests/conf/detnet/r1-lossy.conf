# Like r1.conf, but path B (port c) is shaped with a 2-frame queue, so it
# stays fast but loses about half of the flow.
[global]
clock = realtime
stats_interval = 0
bridging = no
queue_depth = 2
detnet_config = r1-flows.conf
[port a]
ifname = tsn-sw0
cpu = 2
[port b]
ifname = dn-r1b
cpu = 3
[port c]
ifname = dn-r1c
cpu = 4
ats = 7 2 600
