# Like r2.conf, but path A only leaves during 1 ms every 20 ms, so it is
# complete but up to 19 ms late.
[global]
clock = realtime
stats_interval = 0
bridging = no
detnet_config = r2-flows.conf
[port a]
ifname = dn-r2a
cpu = 5
[port b]
ifname = dn-r2b
cpu = 6
cycle_time = 20ms
sched-entry = S 80 1ms
sched-entry = S 00 19ms
