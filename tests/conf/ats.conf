# Asynchronous traffic shaping: TC7 on the port towards h1 is limited by a
# token bucket of 2 Mbit/s with a 3000 B burst. TC0 is not shaped and must
# not be slowed down by TC7's bucket.
[global]
clock = realtime
stats_interval = 0

[port p0]
ifname = tsn-sw0
cpu = 2

[port p1]
ifname = tsn-sw1
cpu = 3
ats = 7 2 3000

[port p2]
ifname = tsn-sw2
cpu = 4
